name: Estiraha Next — Phase 1A Windows Desktop PoC & NSIS Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'phase1a/**'
  pull_request:
    branches:
      - main

jobs:
  linux-cross-compile-and-unit-tests:
    name: Linux Unit/DB Tests & MinGW Windows x64 Cross-Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SQLite3, MinGW-w64 & NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nsis file
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Full Verification Suite
        run: bash scripts/verify_foundation.sh
      - name: Cross-Build Windows Executable & NSIS Installer
        run: bash scripts/build_windows_poc.sh

  windows-native-desktop-poc:
    name: Windows x64 Native Run, Tray, CredManager, NSIS & Screenshot
    runs-on: windows-latest
    needs: linux-cross-compile-and-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run Native Windows Unit, SQLite FTS5 & Credential Manager Tests
        env:
          CGO_ENABLED: '1'
        run: go test -v -tags "sqlite_fts5" ./...

      - name: Compile Native Windows x64 GUI Binary (Wails v3 + CGO)
        env:
          CGO_ENABLED: '1'
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows-amd64 | Out-Null
          go build -trimpath -tags "production sqlite_fts5" -ldflags "-s -w -H windowsgui" -o dist\windows-amd64\EstirahaNext.exe .\cmd\estiraha

      - name: Package NSIS Installer (.exe) & Test Silent Installation
        shell: pwsh
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            Write-Host "makensis.exe not found at default path; installing NSIS via Chocolatey..."
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey NSIS installation failed with exit code $LASTEXITCODE"
            }
          }
          if (-not (Test-Path $makensis)) {
            $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($cmd) {
              $makensis = $cmd.Source
            } else {
              throw "makensis.exe still missing after Chocolatey installation"
            }
          }
          Write-Host "Using NSIS compiler at: $makensis"

          & $makensis "build/windows/nsis/installer.nsi"
          if ($LASTEXITCODE -ne 0) {
            throw "makensis build failed with exit code $LASTEXITCODE"
          }

          $installerPath = Join-Path (Get-Location) "dist\EstirahaNext-Setup-0.1.0-phase1a-x64.exe"
          if (-not (Test-Path $installerPath)) {
            throw "Expected NSIS installer not found at: $installerPath"
          }

          $installDir = "C:\EstirahaPoCInstall"
          $installProc = Start-Process -FilePath $installerPath -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($installProc.ExitCode -ne 0) {
            throw "NSIS silent installer exited with non-zero code: $($installProc.ExitCode)"
          }
          if (-not (Test-Path "$installDir\EstirahaNext.exe") -or -not (Test-Path "$installDir\Uninstall.exe")) {
            throw "NSIS silent installation incomplete: EstirahaNext.exe or Uninstall.exe missing in $installDir"
          }

      - name: Launch Installed Windows App, Capture Live Window Screenshot, Verify Tray/CredManager & Zero Orphans
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $reportPath = Join-Path (Get-Location) "artifacts\phase1a-smoke-report.json"
          $shotPath   = Join-Path (Get-Location) "artifacts\phase1a-windows-window.png"

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class Win32WindowHelper {
              public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);

              [DllImport("kernel32.dll")]
              public static extern IntPtr GetConsoleWindow();

              [DllImport("user32.dll")]
              public static extern bool EnumWindows(EnumWindowsProc lpEnumFunc, IntPtr lParam);

              [DllImport("user32.dll")]
              public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint lpdwProcessId);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern int GetClassName(IntPtr hWnd, StringBuilder lpClassName, int nMaxCount);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern int GetWindowText(IntPtr hWnd, StringBuilder lpString, int nMaxCount);

              [DllImport("user32.dll")]
              public static extern bool IsWindow(IntPtr hWnd);

              [DllImport("user32.dll")]
              public static extern bool IsWindowVisible(IntPtr hWnd);

              [DllImport("user32.dll")]
              public static extern bool IsIconic(IntPtr hWnd);

              [DllImport("user32.dll")]
              public static extern IntPtr GetWindow(IntPtr hWnd, uint uCmd);

              [DllImport("user32.dll")]
              public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);

              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(IntPtr hWnd);

              [DllImport("user32.dll")]
              public static extern bool BringWindowToTop(IntPtr hWnd);

              [DllImport("user32.dll")]
              public static extern IntPtr GetForegroundWindow();

              [DllImport("kernel32.dll")]
              public static extern uint GetCurrentThreadId();

              [DllImport("user32.dll")]
              public static extern bool AttachThreadInput(uint idAttach, uint idAttachTo, bool fAttach);

              public const int  SW_MINIMIZE = 6;
              public const int  SW_RESTORE  = 9;
              public const int  SW_SHOW     = 5;
              public const uint GW_OWNER    = 4;

              public static IntPtr FindMainAppWindow(uint targetPid, out string matchedTitle, out string matchedClass) {
                  IntPtr result = IntPtr.Zero;
                  string foundTitle = "";
                  string foundClass = "";

                  EnumWindows(delegate(IntPtr hWnd, IntPtr lParam) {
                      if (!IsWindow(hWnd) || !IsWindowVisible(hWnd)) {
                          return true;
                      }
                      uint winPid = 0;
                      GetWindowThreadProcessId(hWnd, out winPid);
                      if (winPid != targetPid) {
                          return true;
                      }
                      // Distinguish top-level main application window from owned helper/WebView2 child windows
                      if (GetWindow(hWnd, GW_OWNER) != IntPtr.Zero) {
                          return true;
                      }
                      StringBuilder clsSb = new StringBuilder(256);
                      GetClassName(hWnd, clsSb, clsSb.Capacity);
                      string cls = clsSb.ToString();
                      if (cls.StartsWith("Chrome_WidgetWin") || cls == "Intermediate D3D Window") {
                          return true;
                      }
                      StringBuilder titleSb = new StringBuilder(512);
                      GetWindowText(hWnd, titleSb, titleSb.Capacity);
                      string title = titleSb.ToString();
                      if (title.Contains("Estiraha Next")) {
                          result = hWnd;
                          foundTitle = title;
                          foundClass = cls;
                          return false;
                      }
                      return true;
                  }, IntPtr.Zero);

                  matchedTitle = foundTitle;
                  matchedClass = foundClass;
                  return result;
              }
          }
          "@

          # 1. Minimize GitHub Runner Console / Terminal windows via Windows API so they never occlude Estiraha
          $minimizedHandles = New-Object System.Collections.Generic.List[IntPtr]
          $ownConsole = [Win32WindowHelper]::GetConsoleWindow()
          if ($ownConsole -ne [IntPtr]::Zero -and [Win32WindowHelper]::IsWindowVisible($ownConsole)) {
            [void][Win32WindowHelper]::ShowWindow($ownConsole, [Win32WindowHelper]::SW_MINIMIZE)
            $minimizedHandles.Add($ownConsole)
          }

          $minCallback = [Win32WindowHelper+EnumWindowsProc]{
            param($hWnd, $lParam)
            if (-not [Win32WindowHelper]::IsWindowVisible($hWnd)) { return $true }
            $clsSb = New-Object System.Text.StringBuilder 256
            [void][Win32WindowHelper]::GetClassName($hWnd, $clsSb, $clsSb.Capacity)
            $cls = $clsSb.ToString()
            $titleSb = New-Object System.Text.StringBuilder 512
            [void][Win32WindowHelper]::GetWindowText($hWnd, $titleSb, $titleSb.Capacity)
            $title = $titleSb.ToString()

            if ($cls -eq "CASCADIA_HOSTING_WINDOW_CLASS" -or $cls -eq "ConsoleWindowClass" -or $title -match "GitHub\\Host|Runner\.Listener|pwsh|PowerShell|cmd\.exe") {
              [void][Win32WindowHelper]::ShowWindow($hWnd, [Win32WindowHelper]::SW_MINIMIZE)
              $minimizedHandles.Add($hWnd)
            }
            return $true
          }
          [void][Win32WindowHelper]::EnumWindows($minCallback, [IntPtr]::Zero)
          Write-Host "Minimized $($minimizedHandles.Count) console/terminal window(s) prior to launch."

          function Format-WindowDiag([System.Diagnostics.Process]$p, [IntPtr]$hWnd) {
            $hasExited = if ($null -ne $p) { $p.HasExited } else { $true }
            $pidVal    = if ($null -ne $p) { $p.Id } else { 0 }
            $isWin     = if ($hWnd -ne [IntPtr]::Zero) { [Win32WindowHelper]::IsWindow($hWnd) } else { $false }
            $isVis     = if ($isWin) { [Win32WindowHelper]::IsWindowVisible($hWnd) } else { $false }
            $isIcon    = if ($isWin) { [Win32WindowHelper]::IsIconic($hWnd) } else { $false }
            $ownerPid  = [uint32]0
            if ($isWin) { [void][Win32WindowHelper]::GetWindowThreadProcessId($hWnd, [ref]$ownerPid) }
            $tSb = New-Object System.Text.StringBuilder 512
            if ($isWin) { [void][Win32WindowHelper]::GetWindowText($hWnd, $tSb, $tSb.Capacity) }
            $fg = [Win32WindowHelper]::GetForegroundWindow()
            $fgSb = New-Object System.Text.StringBuilder 512
            if ($fg -ne [IntPtr]::Zero) { [void][Win32WindowHelper]::GetWindowText($fg, $fgSb, $fgSb.Capacity) }
            return ("PID={0} HasExited={1} | HWND=0x{2:X} OwnerPID={3} IsWindow={4} IsVisible={5} IsIconic={6} Title='{7}' | ForegroundHWND=0x{8:X} ForegroundTitle='{9}'" -f `
              $pidVal, $hasExited, $hWnd.ToInt64(), $ownerPid, $isWin, $isVis, $isIcon, $tSb.ToString(), $fg.ToInt64(), $fgSb.ToString())
          }

          try {
            # 2. Launch Estiraha Next with safe 30000ms hold budget so screenshot completes well before Tray cycle & Quit
            $proc = Start-Process -FilePath "C:\EstirahaPoCInstall\EstirahaNext.exe" `
              -ArgumentList "--poc-smoke-report", $reportPath, "--poc-hold-ms", "30000" `
              -PassThru

            # 3. Fast native EnumWindows polling loop verifying PID ownership, Process.HasExited, IsWindow & IsWindowVisible
            $estirahaHwnd = [IntPtr]::Zero
            $matchedTitle = ""
            $matchedClass = ""
            $deadline = (Get-Date).AddSeconds(15)
            while ((Get-Date) -lt $deadline -and $estirahaHwnd -eq [IntPtr]::Zero) {
              if ($proc.HasExited) {
                $diagMsg = Format-WindowDiag $proc $estirahaHwnd
                throw "EstirahaNext.exe exited prematurely (ExitCode=$($proc.ExitCode)) during HWND discovery! $diagMsg"
              }
              $candidate = [Win32WindowHelper]::FindMainAppWindow([uint32]$proc.Id, [ref]$matchedTitle, [ref]$matchedClass)
              if ($candidate -ne [IntPtr]::Zero) {
                $estirahaHwnd = $candidate
                break
              }
              Start-Sleep -Milliseconds 150
            }

            if ($estirahaHwnd -eq [IntPtr]::Zero -or -not [Win32WindowHelper]::IsWindow($estirahaHwnd)) {
              $diagMsg = Format-WindowDiag $proc $estirahaHwnd
              throw "Failed to obtain a valid visible main HWND for EstirahaNext.exe within 15s! $diagMsg"
            }

            $verifiedPid = [uint32]0
            [void][Win32WindowHelper]::GetWindowThreadProcessId($estirahaHwnd, [ref]$verifiedPid)
            if ($verifiedPid -ne [uint32]$proc.Id) {
              $diagMsg = Format-WindowDiag $proc $estirahaHwnd
              throw "HWND PID ownership mismatch! Expected PID $($proc.Id), got $verifiedPid. $diagMsg"
            }

            Write-Host ("Verified valid Estiraha main HWND: 0x{0:X} | PID: {1} | Class: '{2}' | Title: '{3}'" -f `
              $estirahaHwnd.ToInt64(), $verifiedPid, $matchedClass, $matchedTitle)

            # 4. Restore ONLY if minimized (IsIconic), then foreground via SetForegroundWindow & BringWindowToTop (NO AlwaysOnTop)
            if ([Win32WindowHelper]::IsIconic($estirahaHwnd)) {
              Write-Host "Estiraha HWND was iconic (minimized); restoring via SW_RESTORE..."
              [void][Win32WindowHelper]::ShowWindow($estirahaHwnd, [Win32WindowHelper]::SW_RESTORE)
            }

            $fgHwnd = [Win32WindowHelper]::GetForegroundWindow()
            $dummyPid = [uint32]0
            $fgThread = if ($fgHwnd -ne [IntPtr]::Zero) { [Win32WindowHelper]::GetWindowThreadProcessId($fgHwnd, [ref]$dummyPid) } else { [uint32]0 }
            $targetThread = [Win32WindowHelper]::GetWindowThreadProcessId($estirahaHwnd, [ref]$dummyPid)
            $curThread = [Win32WindowHelper]::GetCurrentThreadId()

            if ($fgThread -ne 0 -and $fgThread -ne $curThread) {
              [void][Win32WindowHelper]::AttachThreadInput($curThread, $fgThread, $true)
            }
            if ($targetThread -ne 0 -and $targetThread -ne $curThread) {
              [void][Win32WindowHelper]::AttachThreadInput($curThread, $targetThread, $true)
            }

            $fgOk = [Win32WindowHelper]::SetForegroundWindow($estirahaHwnd)
            [void][Win32WindowHelper]::BringWindowToTop($estirahaHwnd)

            if ($targetThread -ne 0 -and $targetThread -ne $curThread) {
              [void][Win32WindowHelper]::AttachThreadInput($curThread, $targetThread, $false)
            }
            if ($fgThread -ne 0 -and $fgThread -ne $curThread) {
              [void][Win32WindowHelper]::AttachThreadInput($curThread, $fgThread, $false)
            }
            Write-Host ("SetForegroundWindow result: {0} | {1}" -f $fgOk, (Format-WindowDiag $proc $estirahaHwnd))

            # 5. Wait 3500ms for WebView2 surface and Arabic RTL UI + Go RPC state to settle
            Start-Sleep -Milliseconds 3500

            # 6. Re-verify process liveness, HWND validity, PID ownership, non-iconic & visibility immediately before capture
            $recheckPid = [uint32]0
            if ([Win32WindowHelper]::IsWindow($estirahaHwnd)) {
              [void][Win32WindowHelper]::GetWindowThreadProcessId($estirahaHwnd, [ref]$recheckPid)
            }
            if ($proc.HasExited -or `
                -not [Win32WindowHelper]::IsWindow($estirahaHwnd) -or `
                -not [Win32WindowHelper]::IsWindowVisible($estirahaHwnd) -or `
                [Win32WindowHelper]::IsIconic($estirahaHwnd) -or `
                $recheckPid -ne [uint32]$proc.Id) {
              $diagMsg = Format-WindowDiag $proc $estirahaHwnd
              throw "Pre-screenshot HWND/process validation failed! $diagMsg"
            }
            Write-Host ("Pre-capture state confirmed OK: {0}" -f (Format-WindowDiag $proc $estirahaHwnd))

            # 7. Capture full real Windows desktop showing Estiraha Arabic RTL UI clearly
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save($shotPath, [System.Drawing.Imaging.ImageFormat]::Png)
            $gfx.Dispose()
            $bmp.Dispose()

            if (-not $proc.WaitForExit(45000)) {
              $proc.Kill()
              $diagMsg = Format-WindowDiag $proc $estirahaHwnd
              throw "EstirahaNext.exe did not exit cleanly within 45000ms timeout! $diagMsg"
            }
          } finally {
            # Restore minimized console windows cleanly after test completes
            foreach ($h in $minimizedHandles) {
              if ([Win32WindowHelper]::IsWindow($h)) {
                [void][Win32WindowHelper]::ShowWindow($h, [Win32WindowHelper]::SW_RESTORE)
              }
            }
          }

          Start-Sleep -Seconds 1
          $orphans = Get-Process -Name "EstirahaNext" -ErrorAction SilentlyContinue
          if ($orphans) {
            throw "Orphan EstirahaNext process remained after shutdown!"
          }

          if (-not (Test-Path $reportPath)) {
            throw "Smoke report JSON was not generated"
          }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          Write-Host ($report | ConvertTo-Json -Depth 6)
          if (-not $report.success) {
            throw "Windows Desktop PoC smoke report indicated failure"
          }

      - name: Verify Missing WebView2 Graceful Handling (Exit Code 78, Zero Crash)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "C:\EstirahaPoCInstall\EstirahaNext.exe" `
            -ArgumentList "--simulate-missing-webview2", "--headless" `
            -Wait -PassThru
          if ($p.ExitCode -ne 78) {
            throw "Expected ExitCode 78 for simulated missing WebView2, got $($p.ExitCode)"
          }

      - name: Test Silent Uninstall & Verify User Data Preservation
        shell: pwsh
        run: |
          $installDir = "C:\EstirahaPoCInstall"

          # Real user-data paths defined in Estiraha Next Architecture & Wails v3 WindowsOptions:
          # 1) %LOCALAPPDATA%\EstirahaNext (SQLite DB, Backups & Smart Image Engine Cache)
          # 2) %APPDATA%\EstirahaNext.exe (Wails v3 WebView2 user profile directory)
          $estirahaDataDir = Join-Path $env:LOCALAPPDATA "EstirahaNext"
          $estirahaCacheDir = Join-Path $estirahaDataDir "ImageCache"
          New-Item -ItemType Directory -Force -Path $estirahaCacheDir | Out-Null
          $dbSentinel = Join-Path $estirahaDataDir "user_library_sentinel.json"
          $cacheSentinel = Join-Path $estirahaCacheDir "poster_cache_sentinel.bin"
          Set-Content -Path $dbSentinel -Value '{"sentinel":"DO_NOT_DELETE_USER_LIBRARY_DB"}' -Encoding UTF8
          Set-Content -Path $cacheSentinel -Value "DO_NOT_DELETE_USER_CACHE" -Encoding UTF8

          $webviewDataDir = Join-Path $env:APPDATA "EstirahaNext.exe"
          New-Item -ItemType Directory -Force -Path $webviewDataDir | Out-Null
          $wvSentinel = Join-Path $webviewDataDir "webview2_profile_sentinel.txt"
          Set-Content -Path $wvSentinel -Value "DO_NOT_DELETE_WEBVIEW_PROFILE" -Encoding UTF8

          # Execute NSIS silent uninstaller synchronously (/S MUST precede _?=$installDir)
          $uninstProc = Start-Process -FilePath "$installDir\Uninstall.exe" `
            -ArgumentList "/S", "_?=$installDir" `
            -Wait -PassThru
          if ($uninstProc.ExitCode -ne 0) {
            throw "NSIS silent uninstaller returned non-zero exit code: $($uninstProc.ExitCode)"
          }

          # Verify program executable and shortcuts are removed
          if (Test-Path "$installDir\EstirahaNext.exe") {
            throw "Uninstall failed: EstirahaNext.exe still exists in $installDir"
          }
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath("Desktop")) "Estiraha Next.lnk"
          if (Test-Path $desktopShortcut) {
            throw "Uninstall failed: Desktop shortcut still exists at $desktopShortcut"
          }

          # Verify ALL user data directories & sentinel files remain 100% intact (do NOT delete them)
          if (-not (Test-Path $dbSentinel) -or -not (Test-Path $cacheSentinel) -or -not (Test-Path $wvSentinel)) {
            throw "SAFETY VIOLATION: Uninstaller deleted user data sentinel files!"
          }

          $uninstallReport = @{
            silentInstallVerified      = $true
            silentUninstallExitCode    = $uninstProc.ExitCode
            programBinaryRemoved       = (-not (Test-Path "$installDir\EstirahaNext.exe"))
            userAppDataSentinelIntact  = (Test-Path $dbSentinel)
            userCacheSentinelIntact    = (Test-Path $cacheSentinel)
            webviewProfileIntact       = (Test-Path $wvSentinel)
            verifiedAtUtc              = (Get-Date).ToUniversalTime().ToString("o")
          }
          $uninstallReportPath = Join-Path (Get-Location) "artifacts\phase1a-installer-report.json"
          $uninstallReport | ConvertTo-Json -Depth 4 | Set-Content -Path $uninstallReportPath -Encoding UTF8
          Write-Host ($uninstallReport | ConvertTo-Json -Depth 4)

      - name: Upload Windows Installer, Live Window Screenshot & Smoke/Installer Reports
        uses: actions/upload-artifact@v4
        with:
          name: EstirahaNext-Phase1A-Windows-PoC-Evidence
          path: |
            dist/EstirahaNext-Setup-0.1.0-phase1a-x64.exe
            artifacts/phase1a-windows-window.png
            artifacts/phase1a-smoke-report.json
            artifacts/phase1a-installer-report.json
